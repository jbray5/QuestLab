<title>The Chapel Above Blackreef</title>
<style>
  :root {
    --soot: #0d0a07; --parchment: #e8d9b0; --dim: #9a8a67;
    --candle: #e0a94d; --cold: #9fb4c7; --edge: #2c2314; --card: #14100a;
  }
  html { background: var(--soot); }
  body {
    margin: 0; color: var(--parchment); background: var(--soot);
    font-family: Palatino, "Palatino Linotype", "Book Antiqua", Georgia, serif;
    line-height: 1.65;
  }
  main { max-width: 62rem; margin: 0 auto; padding: 1.2rem 1rem 4rem; }
  .eyebrow {
    font-size: .72rem; letter-spacing: .28em; color: var(--dim);
    text-transform: uppercase; margin: 1.4rem 0 .4rem; text-align: center;
  }
  h1 {
    font-size: clamp(1.6rem, 4.5vw, 2.6rem); font-weight: 400; margin: 0 0 .4rem;
    text-align: center; text-wrap: balance; letter-spacing: .02em;
  }
  h2 { font-size: 1.45rem; font-weight: 400; margin: 0 0 .6rem; letter-spacing: .02em; }
  .intro {
    max-width: 36rem; margin: 0 auto 1.4rem; text-align: center;
    color: var(--dim); font-style: italic;
  }
  .intro b { color: var(--parchment); font-weight: 400; }
  .scene { position: relative; border: 1px solid var(--edge); border-radius: 4px; overflow: hidden; }
  .scene img { display: block; width: 100%; height: auto; }
  .spot {
    position: absolute; transform: translate(-50%, -50%);
    width: 48px; height: 48px; border-radius: 50%; padding: 0;
    background: radial-gradient(circle, rgba(224,169,77,.30) 0%, rgba(224,169,77,.10) 45%, transparent 70%);
    border: 1px solid rgba(224,169,77,.5); cursor: pointer;
    animation: breathe 5s ease-in-out infinite;
  }
  .spot::after {
    content: attr(data-label); position: absolute; top: 105%; left: 50%;
    transform: translateX(-50%); white-space: nowrap;
    font-size: .62rem; letter-spacing: .22em; text-transform: uppercase;
    color: var(--candle); text-shadow: 0 1px 4px #000;
    font-family: Palatino, Georgia, serif;
  }
  .spot:focus-visible { outline: 2px solid var(--candle); outline-offset: 3px; }
  .spot.visited { opacity: .55; }
  .spot.cold {
    opacity: .12; border-color: rgba(159,180,199,.5);
    background: radial-gradient(circle, rgba(159,180,199,.22) 0%, rgba(159,180,199,.08) 45%, transparent 70%);
    animation: none;
  }
  .spot.cold::after { color: var(--cold); opacity: 0; transition: opacity .4s; }
  .spot.cold:hover, .spot.cold:focus-visible, .spot.cold:active {
    opacity: 1; box-shadow: 0 0 18px 3px rgba(159,180,199,.28);
  }
  .spot.cold:hover::after, .spot.cold:focus-visible::after { opacity: 1; }
  @keyframes breathe {
    0%, 100% { box-shadow: 0 0 10px 2px rgba(224,169,77,.30); }
    50% { box-shadow: 0 0 20px 6px rgba(224,169,77,.12); }
  }
  /* The altar flame: leans toward the sea. If someone asks, the answer is "…yes?" */
  .flame {
    position: absolute; width: 14px; height: 26px; pointer-events: none;
    transform: translate(-50%, -100%) rotate(-8deg); transform-origin: 50% 100%;
    background: radial-gradient(ellipse 50% 65% at 50% 75%, rgba(255,230,170,.85), rgba(224,169,77,.35) 60%, transparent 75%);
    filter: blur(1px); animation: lean 3.2s ease-in-out infinite;
  }
  @keyframes lean {
    0%, 100% { transform: translate(-50%, -100%) rotate(-7deg) scale(1); opacity: .8; }
    50% { transform: translate(-50%, -100%) rotate(-10deg) scale(1.08); opacity: .95; }
  }
  @media (prefers-reduced-motion: reduce) {
    .spot, .flame { animation: none; }
  }
  .whisper { text-align: center; color: var(--dim); font-style: italic; font-size: .9rem; margin-top: .9rem; }

  /* Lightbox */
  .veil {
    position: fixed; inset: 0; background: rgba(6,4,2,.88); z-index: 10;
    display: none; overflow-y: auto; padding: 3vh 1rem 6vh;
  }
  .veil.open { display: block; }
  .panel {
    max-width: 36rem; margin: 0 auto; background: var(--card);
    border: 1px solid var(--edge); border-radius: 6px; padding: 1.4rem 1.5rem 1.8rem;
    box-shadow: 0 12px 60px rgba(0,0,0,.7);
  }
  .back {
    background: none; border: none; color: var(--dim); cursor: pointer;
    font: inherit; font-size: .82rem; letter-spacing: .14em; padding: 0;
    margin-bottom: 1.1rem; text-transform: uppercase;
  }
  .back:hover, .back:focus-visible { color: var(--candle); }
  .read { color: var(--parchment); margin: .9rem 0; }
  .read i { color: var(--dim); }
  del { color: var(--dim); text-decoration-color: rgba(224,169,77,.6); }
  .label {
    font-size: .68rem; letter-spacing: .26em; text-transform: uppercase;
    color: var(--dim); margin: 1.4rem 0 .5rem;
  }
  .cards { display: flex; flex-direction: column; gap: .6rem; margin: 1rem 0; }
  .card {
    margin: 0; padding: .7rem .9rem; font-style: italic; color: var(--dim);
    border: 1px solid var(--edge); border-radius: 3px;
    background: linear-gradient(175deg, rgba(232,217,176,.05), transparent 60%);
  }
  .glyphline {
    display: flex; flex-wrap: wrap; gap: .35rem; justify-content: center;
    font-size: clamp(1.6rem, 4.2vw, 2.4rem); margin: 1.2rem 0; color: var(--parchment);
  }
  .mark { position: relative; padding-bottom: 1.1rem; }
  .mark small {
    position: absolute; left: 50%; bottom: 0; transform: translateX(-50%) rotate(-6deg);
    font-size: .8rem; font-style: italic; color: var(--candle); white-space: nowrap;
  }
  .book {
    border: 1px solid var(--edge); border-radius: 3px; padding: 1rem 1.1rem 1.2rem;
    background: linear-gradient(178deg, rgba(232,217,176,.07), rgba(232,217,176,.02) 55%);
    margin: .4rem 0 1rem; text-align: center;
  }
  .bookname { margin: 0 0 .8rem; font-style: italic; color: var(--dim); font-size: .9rem; }
  .bless-glyphs {
    display: flex; justify-content: center; flex-wrap: wrap; gap: .3rem;
    font-size: clamp(1.15rem, 3.4vw, 1.7rem); color: var(--parchment);
  }
  .bless-glyphs .gap { width: 1.1em; }
  .bless-plain {
    margin-top: .45rem; letter-spacing: .3em; color: var(--dim);
    font-size: clamp(.8rem, 2.4vw, 1rem);
  }
  .younghand { margin: 1rem 0 0; font-style: italic; color: var(--dim); font-size: .85rem; }
  .ask { display: flex; gap: .5rem; }
  .field {
    flex: 1; min-width: 0; background: var(--soot); color: var(--parchment);
    border: 1px solid var(--edge); border-radius: 3px; padding: .55rem .7rem;
    font: inherit;
  }
  .field:focus-visible { outline: 2px solid var(--candle); outline-offset: 1px; }
  .go {
    background: none; border: 1px solid var(--candle); border-radius: 3px;
    color: var(--candle); font: inherit; letter-spacing: .06em;
    padding: .55rem 1rem; cursor: pointer;
  }
  .go:hover, .go:focus-visible { background: rgba(224,169,77,.12); }
  .go.solo { margin-top: .4rem; }
  .answer { min-height: 1.4rem; font-style: italic; color: var(--parchment); margin: .9rem 0 0; }
  .answer.swim { animation: swim 1s ease-out; }
  @keyframes swim {
    0% { filter: blur(3px); opacity: 0; letter-spacing: .12em; }
    60% { filter: blur(1px); opacity: .7; letter-spacing: .04em; }
    100% { filter: blur(0); opacity: 1; letter-spacing: normal; }
  }
  @media (prefers-reduced-motion: reduce) { .answer.swim { animation: none; } }
  .act-link {
    display: inline-block; margin-top: .6rem; padding: .6rem 1.1rem;
    border: 1px solid var(--candle); border-radius: 3px; color: var(--candle);
    text-decoration: none; letter-spacing: .08em;
  }
  .act-link:hover { background: rgba(224,169,77,.12); }
</style>

<main>
  <p class="eyebrow">Blackreef Cove &middot; above the town</p>
  <h1>The Chapel of the Kept Light</h1>
  <p class="intro">Salt-bitten stone, one great room, more books than pews. Bent over a table of pages, a woman with ink to her elbows does not look up. <b>&ldquo;Close the door. The damp gets in the pages.&rdquo;</b></p>

      <h2>The Archive</h2>
      <p class="read">Shelf on shelf of the order&rsquo;s rolls &mdash; tithe ledgers, chapel
      accounts, births and burials in a dozen dead hands. The whole town, kept in ink.</p>
      <div class="cards">
        <p class="card">&ldquo;Year of the long fog &mdash; fishing tithe paid in kind. None took boats out.&rdquo;</p>
        <p class="card">&ldquo;Roof slate, six bells, and the keeping of the light: 3 gold, 2 silver, as sworn.&rdquo;</p>
        <p class="card">&ldquo;Year of the quiet water &mdash; fishing tithe paid in kind. None took boats out.&rdquo;</p>

<template id="tpl-table">
      <h2>Maren&rsquo;s Table</h2>
      <p class="read">Three weeks of pages. The same phrase circled again and again in a
      tired hand. Beside the stack: a cup of tea gone cold and untouched, and a rushlight
      burned to nothing.</p>
      <div class="glyphline" aria-label="thirteen marks, two annotated"><span class="mark">◆</span><span class="mark">●</span><span class="mark">▲</span><span class="mark">✦<small>= E</small></span><span class="mark">⬟<small>= H</small></span><span class="mark">●</span><span class="mark">▲</span><span class="mark">✦</span><span class="mark">◆</span><span class="mark">⬟</span><span class="mark">✚</span><span class="mark">◼</span><span class="mark">✱</span></div>
      <p class="read"><i>&ldquo;Mind what you read aloud in this room. The pages hum when
      they&rsquo;re spoken near.&rdquo;</i></p>

<template id="tpl-warded">
      <h2>The Warded Page</h2>
      <p class="read">On the lectern, a single page of old script &mdash; and down its
      margin, years of crossed-out guesses in Maren&rsquo;s hand: <del>tide</del>,
      <del>lantern</del>, <del>the first star</del>, dozens more.</p>
      <p class="read"><i>&ldquo;Not everything old wants reading. Some pages want a WORD
      &mdash; and won&rsquo;t say which. This one has kept me humble for nine
      years.&rdquo;</i></p>
      <p class="label">Offer the page a word</p>
      <form class="ask" data-kind="ward">
        <input class="field" type="text" autocomplete="off" spellcheck="false" aria-label="A word for the page" />
        <button class="go" type="submit">Speak it</button>
      </form>
      <p class="answer" aria-live="polite"></p>
    </template>
<template id="tpl-altar">
      <h2>The Altar</h2>
      <p class="read">No idol. No carved god. A stone shelf, and on it a small lantern with
      no wick &mdash; burning anyway, a steady silver-white flame. The chapel&rsquo;s own
      kept light, in the same craft as the great shrines.</p>
      <p class="read"><i>&ldquo;Every chapel keeps one. Ours has never gone out.&rdquo;</i>
      &mdash; and then, quieter: <i>&ldquo;The singing started three weeks ago. The flame
      has been leaning toward the sea ever since.&rdquo;</i></p>
      <button class="go solo" data-kind="reveal">Kneel a moment</button>
      <p class="answer" data-text="The warmth reaches you before your knees reach the stone. Whatever you carry, the light does not mind holding it a while." aria-live="polite"></p>
    </template>
<template id="tpl-ring">
      <h2>The Iron Ring</h2>
      <p class="read">A mooring ring, set into the chapel floor. Iron gone glass-smooth
      &mdash; worn by rope, and by more years than the room above it.</p>
      <p class="read"><i>&ldquo;Older than the chapel,&rdquo;</i> Maren says, without
      looking up. <i>&ldquo;They built the room around it.&rdquo;</i></p>
      <button class="go solo" data-kind="reveal">Touch it</button>
      <p class="answer" data-text="Cold. Colder than the stone it sits in. And worn the way iron only wears when something heavy pulled against it for a very long time." aria-live="polite"></p>
    </template>

<script>
  const ROLLS = {
    thornwood: "Thornwood \u2014 The Mooring, freehold. Tithes current. Two daughters entered in the parish roll.",
    ashmantle: "House Ashmantle \u2014 lamp-tithe paid in full, two hundred years unbroken. \u2026Final entry: WITHDRAWAL. Removed from the order's keeping: the house lamp. Silver, wickless. Bond-piece of the sworn. Tithe discontinued thereafter.",
    thorne: "Thorne, Edrik \u2014 mariner. No tithe owed. Marginal note, older hand: 'pays in other ways.'",
    pike: "Pike \u2014 dockside. Tithes\u2026 irregular. See also: Pike.",
  };
  const NO_ENTRY = "No entry in the rolls. The sea keeps its own census.";
  const DECLINES = [
    "The page declines.",
    "The script swims, considers, and settles back unread.",
    "For a moment \u2014 no. Nothing.",
    "The page has heard worse guesses. It declines this one too.",
  ];
  let declineAt = Math.floor(DECLINES.length * 0.7);

  const veil = document.getElementById("veil");
  const body = document.getElementById("panel-body");
  let lastSpot = null;

  function say(el, text) {
    el.classList.remove("swim");
    void el.offsetWidth;
    el.textContent = text;
    el.classList.add("swim");
  }

  function wire() {
    body.querySelectorAll(".ask").forEach((form) => {
      form.addEventListener("submit", (e) => {
        e.preventDefault();
        const q = form.querySelector(".field").value.trim().toLowerCase();
        const out = form.parentElement.querySelector(".answer");
        if (!q) return;
        if (form.dataset.kind === "rolls") {
          const hit = Object.keys(ROLLS).find((k) => q.includes(k));
          say(out, hit ? ROLLS[hit] : NO_ENTRY);
        } else {
          declineAt = (declineAt + 1 + Math.floor(q.length % 3)) % DECLINES.length;
          say(out, DECLINES[declineAt]);
        }
        form.querySelector(".field").value = "";
      });
    });
    body.querySelectorAll("[data-kind='reveal']").forEach((btn) => {
      btn.addEventListener("click", () => {
        say(btn.parentElement.querySelector(".answer"), btn.parentElement.querySelector(".answer").dataset.text);
      });
    });
  }

  function open(id, spot) {
    const tpl = document.getElementById("tpl-" + id);
    if (!tpl) return;
    body.innerHTML = tpl.innerHTML;
    veil.classList.add("open");
    lastSpot = spot;
    spot.classList.add("visited");
    wire();
    document.getElementById("back").focus();
  }
  function close() {
    veil.classList.remove("open");
    if (lastSpot) lastSpot.focus();
  }

  document.querySelectorAll(".spot").forEach((s) =>
    s.addEventListener("click", () => open(s.dataset.go, s))
  );
  document.getElementById("back").addEventListener("click", close);
  veil.addEventListener("click", (e) => { if (e.target === veil) close(); });
  document.addEventListener("keydown", (e) => { if (e.key === "Escape") close(); });
</script>
