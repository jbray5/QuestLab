<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>The Drowned Temple — DM Blueprint</title>
<link href="https://fonts.googleapis.com/css2?family=IM+Fell+English:ital@0;1&display=swap" rel="stylesheet">
<style>
  html,body{margin:0;background:#04121c;font-family:"IM Fell English",Georgia,serif;}
  svg{width:100%;height:auto;display:block;}
  @media print{ html,body{background:#fff;} }
</style>
</head>
<body>
<svg viewBox="0 0 1600 1000" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="sea" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#0e3d52"/><stop offset=".5" stop-color="#082635"/><stop offset="1" stop-color="#04121c"/>
    </linearGradient>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#c9d6d2"/><stop offset="1" stop-color="#8fb0b4"/>
    </linearGradient>
    <linearGradient id="stone" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#1c2a30"/><stop offset="1" stop-color="#101a20"/>
    </linearGradient>
    <radialGradient id="glowT" cx=".5" cy=".5" r=".5">
      <stop offset="0" stop-color="#7fd4c8" stop-opacity=".55"/><stop offset="1" stop-color="#7fd4c8" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glowW" cx=".5" cy=".5" r=".5">
      <stop offset="0" stop-color="#ffd98a" stop-opacity=".6"/><stop offset="1" stop-color="#ffd98a" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <!-- sky + sea -->
  <rect width="1600" height="120" fill="url(#sky)"/>
  <rect y="120" width="1600" height="880" fill="url(#sea)"/>
  <line x1="0" y1="120" x2="1600" y2="120" stroke="#e8f2ee" stroke-width="3" opacity=".8"/>

  <!-- the ship -->
  <g transform="translate(430,96)" fill="#20262b">
    <path d="M-70,20 Q0,44 70,20 L52,6 L-52,6 Z"/>
    <rect x="-4" y="-46" width="5" height="52"/>
    <path d="M1,-44 q34,14 0,30 Z" fill="#2c343a"/>
  </g>
  <text x="430" y="66" text-anchor="middle" fill="#dbe7e3" font-size="17" font-style="italic">the ship waits · glass sea · dawn</text>

  <!-- parted water walls + stair -->
  <path d="M360,120 C380,300 420,520 470,700" fill="none" stroke="#7fd4c8" stroke-width="5" opacity=".55"/>
  <path d="M520,120 C540,260 560,330 585,392" fill="none" stroke="#7fd4c8" stroke-width="5" opacity=".55"/>
  <text x="318" y="210" fill="#7fd4c8" font-size="15" font-style="italic" transform="rotate(80 318 210)">standing water · the sea holds its breath</text>
  <!-- stairs -->
  <g stroke="#9fb4ae" stroke-width="3">
    <line x1="430" y1="130" x2="452" y2="130"/><line x1="440" y1="152" x2="462" y2="152"/>
    <line x1="450" y1="174" x2="472" y2="174"/><line x1="460" y1="196" x2="482" y2="196"/>
    <line x1="470" y1="218" x2="492" y2="218"/><line x1="480" y1="240" x2="502" y2="240"/>
    <line x1="490" y1="262" x2="512" y2="262"/><line x1="500" y1="284" x2="522" y2="284"/>
  </g>

  <!-- fish in the water walls + the big shadow -->
  <g fill="#57808a" opacity=".8">
    <path d="M300,260 q10,-6 18,0 q-8,6 -18,0 Z"/><path d="M282,330 q9,-5 16,0 q-7,5 -16,0 Z"/>
    <path d="M610,300 q10,-6 18,0 q-8,6 -18,0 Z"/>
  </g>
  <path d="M120,520 q120,-46 260,-10 q-40,34 -140,40 q-80,4 -120,-30 Z" fill="#0c2230" opacity=".9"/>
  <text x="150" y="575" fill="#3f6470" font-size="14" font-style="italic">something large keeps its distance</text>

  <!-- ============ ROOMS ============ -->
  <!-- R1 Tide Gate -->
  <g>
    <rect x="470" y="392" width="180" height="110" rx="10" fill="url(#stone)" stroke="#3d565c" stroke-width="2.5"/>
    <path d="M650,412 a34,40 0 0 1 0,72" fill="none" stroke="#7fd4c8" stroke-width="7" opacity=".85"/>
    <text x="676" y="392" fill="#7fd4c8" font-size="14" font-style="italic">door of standing water · fish hang frozen inside it</text>
    <circle cx="512" cy="470" r="14" fill="url(#glowT)"/>
    <circle cx="512" cy="470" r="7" fill="#0f3a44" stroke="#7fd4c8" stroke-width="2"/>
    <text x="536" y="496" fill="#9fd4c8" font-size="13" font-style="italic">silverfish pool (the hint)</text>
    <text x="560" y="430" fill="#e8d9a8" font-size="15">⬟ ● ▲ ✦</text>
  </g>

  <!-- R2 Nave -->
  <g>
    <rect x="650" y="400" width="240" height="120" rx="10" fill="url(#stone)" stroke="#3d565c" stroke-width="2.5"/>
    <g stroke="#31454c" stroke-width="7"><line x1="700" y1="410" x2="700" y2="512"/><line x1="770" y1="410" x2="770" y2="512"/><line x1="840" y1="410" x2="840" y2="512"/></g>
    <rect x="726" y="446" width="46" height="58" rx="4" fill="#243b41" stroke="#5b7d84" stroke-width="2"/>
    <text x="749" y="480" text-anchor="middle" fill="#a8c6c0" font-size="11">OATHS</text>
  </g>

  <!-- Gallery corridor (sloping) -->
  <g>
    <path d="M890,470 L1020,560 L1020,610 L890,520 Z" fill="url(#stone)" stroke="#3d565c" stroke-width="2.5"/>
    <g fill="#ffd98a">
      <circle cx="912" cy="497" r="4.5"/><circle cx="938" cy="512" r="4.5"/><circle cx="958" cy="530" r="4.5"/><circle cx="984" cy="544" r="4.5"/><circle cx="1004" cy="560" r="4.5"/>
    </g>
    <text x="900" y="462" fill="#ffd98a" font-size="13" font-style="italic">lamp-limpets — step the glow</text>
  </g>

  <!-- R3 Bell Well (vertical shaft) -->
  <g>
    <rect x="1020" y="440" width="130" height="330" rx="12" fill="url(#stone)" stroke="#3d565c" stroke-width="2.5"/>
    <path d="M1035,470 q50,60 0,120 M1150,500 q-50,60 0,120 M1035,650 q50,50 0,100" fill="none" stroke="#31454c" stroke-width="4"/>
    <path d="M1058,560 q27,-24 54,0 l-8,44 q-19,10 -38,0 Z" fill="#33502f" stroke="#6d8f5a" stroke-width="2.5"/>
    <circle cx="1085" cy="616" r="4" fill="#6d8f5a"/>
    <g fill="#5a4a56"><circle cx="1052" cy="552" r="6"/><circle cx="1122" cy="566" r="6"/><circle cx="1090" cy="528" r="6"/></g>
    <text x="1158" y="560" fill="#9a8aa0" font-size="13" font-style="italic">3 reachers, dormant on the bell</text>
    <text x="1158" y="580" fill="#6d8f5a" font-size="13" font-style="italic">the bell hums the refrain</text>
  </g>

  <!-- R4 Keeper's Cell -->
  <g>
    <rect x="850" y="660" width="170" height="100" rx="10" fill="url(#stone)" stroke="#4a6e9c" stroke-width="2.5"/>
    <g stroke="#57808a" stroke-width="1.5" opacity=".9">
      <line x1="866" y1="676" x2="866" y2="694"/><line x1="872" y1="676" x2="872" y2="694"/><line x1="878" y1="676" x2="878" y2="694"/><line x1="884" y1="676" x2="884" y2="694"/><line x1="862" y1="685" x2="888" y2="685"/>
      <line x1="898" y1="676" x2="898" y2="694"/><line x1="904" y1="676" x2="904" y2="694"/><line x1="910" y1="676" x2="910" y2="694"/><line x1="916" y1="676" x2="916" y2="694"/><line x1="894" y1="685" x2="920" y2="685"/>
    </g>
    <text x="866" y="716" fill="#8fb0c4" font-size="12" font-style="italic">tallies past counting</text>
    <rect x="944" y="700" width="56" height="44" rx="6" fill="#16242c" stroke="#4a6e9c" stroke-width="1.5"/>
    <text x="972" y="726" text-anchor="middle" fill="#8fb0c4" font-size="11">the alcove</text>
  </g>

  <!-- R5 The Heart -->
  <g>
    <rect x="1020" y="770" width="420" height="180" rx="14" fill="url(#stone)" stroke="#6e4550" stroke-width="3"/>
    <circle cx="1330" cy="856" r="40" fill="url(#glowW)"/>
    <circle cx="1330" cy="856" r="24" fill="#241d16" stroke="#c9a25a" stroke-width="3"/>
    <path d="M1300,830 q30,52 60,0 M1300,882 q30,-52 60,0" fill="none" stroke="#0a0a0f" stroke-width="7"/>
    <text x="1330" y="920" text-anchor="middle" fill="#c9a25a" font-size="13" font-style="italic">the sealed lantern · black chains</text>
    <g transform="translate(1230,828)"><rect x="-7" y="0" width="14" height="34" rx="6" fill="#3a4650"/><circle cx="0" cy="-9" r="8" fill="#3a4650"/></g>
    <text x="1230" y="886" text-anchor="middle" fill="#8fa4b0" font-size="12">EDRIK · held</text>
    <g transform="translate(1100,840)">
      <path d="M0,-26 q16,10 10,34 q-10,16 -20,0 q-6,-24 10,-34 Z" fill="#153842" stroke="#7fd4c8" stroke-width="2"/>
      <path d="M-14,10 q-20,16 -30,2 M14,10 q20,16 30,2" fill="none" stroke="#101418" stroke-width="6"/>
    </g>
    <text x="1100" y="900" text-anchor="middle" fill="#7fd4c8" font-size="12">NEREA / the thing</text>
  </g>

  <!-- route line -->
  <path d="M470,130 C520,300 540,380 560,447 L770,460 L940,510 L1085,530 L1085,700 L935,710 L935,760 L1120,820"
        fill="none" stroke="#e8d9a8" stroke-width="2.5" stroke-dasharray="7 7" opacity=".7"/>

  <!-- numbered markers -->
  <g font-size="17" font-weight="bold" text-anchor="middle">
    <circle cx="560" cy="447" r="15" fill="#c9a25a"/><text x="560" y="453" fill="#181206">1</text>
    <circle cx="770" cy="460" r="15" fill="#5b7d84"/><text x="770" y="466" fill="#0c1416">2</text>
    <circle cx="955" cy="520" r="15" fill="#b0563f"/><text x="955" y="526" fill="#180b06">T</text>
    <circle cx="1085" cy="500" r="15" fill="#7a5a8c"/><text x="1085" y="506" fill="#120a18">3</text>
    <circle cx="935" cy="712" r="15" fill="#4a6e9c"/><text x="935" y="718" fill="#0a1220">4</text>
    <circle cx="1120" cy="800" r="15" fill="#6e4550"/><text x="1120" y="806" fill="#170a0d">5</text>
  </g>

  <!-- ============ LEGEND PANEL ============ -->
  <rect x="20" y="620" width="760" height="360" rx="12" fill="#0a1a24" stroke="#2c4650" stroke-width="2"/>
  <text x="40" y="656" fill="#e8d9a8" font-size="24">THE DROWNED TEMPLE — DM BLUEPRINT</text>
  <text x="40" y="680" fill="#b0563f" font-size="14" font-weight="bold">DM EYES ONLY — NEVER ON THE PROJECTOR</text>

  <g font-size="14.5" fill="#c5d6d2">
    <text x="40" y="712"><tspan fill="#c9a25a" font-weight="bold">① TIDE GATE — puzzle.</tspan> Press tiles ⬟ ● ▲ ✦ (H-O-M-E) in order → the water door parts. Wrong order: it SLAPS —</text>
    <text x="40" y="732">DC 12 DEX or 1d4 cold, pushed back. Hint: silverfish in the pool school into the sequence when watched.</text>
    <text x="40" y="762"><tspan fill="#5b7d84" font-weight="bold">② DROWNED NAVE — lore.</tspan> 🔲 open explorable: Covenant Stone. ASHMANTLE legible. One room, one beat.</text>
    <text x="40" y="792"><tspan fill="#b0563f" font-weight="bold">Ⓣ THE GALLERY — trap.</tspan> Lamp-limpet tiles wind through dark stone. 🔲 explorable: Glyph Wall as they walk.</text>
    <text x="40" y="812">A dark step = cold hands from below — DC 12 DEX or 1d4 cold + grappled one round. Step the glow, live.</text>
    <text x="40" y="842"><tspan fill="#7a5a8c" font-weight="bold">③ BELL WELL — the choice.</tspan> RING IT: the deep door opens instantly + 3 reachers wake (AC 12 · HP 16 · +4</text>
    <text x="40" y="862">claw 1d6+2 · pull to the water, escape DC 12). OR THE LONG CLIMB: group Stealth DC 12, then Athletics DC 12s.</text>
    <text x="40" y="892"><tspan fill="#4a6e9c" font-weight="bold">④ KEEPER'S CELL — the soul. NO mechanics.</tspan> Tallies past counting. The infant alcove: a half-finished</text>
    <text x="40" y="912">carving of a boat. Let them stand in it. NEVER CUT THIS ROOM.</text>
    <text x="40" y="942"><tspan fill="#6e4550" font-weight="bold">⑤ THE HEART — boss.</tspan> 🔲 explorable: Sealed Lantern + The Kept. Then NEREA (see boss card: AC 14 · HP 75 ·</text>
    <text x="40" y="962">phases at 25/50 dmg · lair actions init 20 · free Edrik: action + DC 12 STR → he fights, +4 / 1d8+2).</text>
  </g>

  <rect x="800" y="940" width="640" height="40" rx="8" fill="#101c26" stroke="#2c4650" stroke-width="1.5"/>
  <text x="818" y="966" fill="#9fb4ae" font-size="14"><tspan fill="#e8d9a8">CUT ORDER:</tspan> long climb collapses (ring or nothing) → Nave+Cell merge → Gate opens at a touch. Cell never dies.</text>
</svg>
</body>
</html>
