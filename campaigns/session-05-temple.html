<title>The Drowned Temple</title>
<!--
  Session 5 explorable — The Drowned Temple. Player surface.
-->
<style>
  :root {
    --soot: #06090c; --parchment: #cfd9de; --dim: #6f8089;
    --glow: #9fc4d4; --warm: #e0a94d; --edge: #1a232a; --card: #0a1014;
  }
  html { background: var(--soot); }
  body {
    margin: 0; color: var(--parchment); background: var(--soot);
    font-family: Palatino, "Palatino Linotype", "Book Antiqua", Georgia, serif;
    line-height: 1.65;
  }
  main { max-width: 62rem; margin: 0 auto; padding: 1.2rem 1rem 4rem; }
  .eyebrow {
    font-size: .72rem; letter-spacing: .28em; color: var(--dim);
    text-transform: uppercase; margin: 1.4rem 0 .4rem; text-align: center;
  }
  h1 {
    font-size: clamp(1.6rem, 4.5vw, 2.6rem); font-weight: 400; margin: 0 0 .4rem;
    text-align: center; text-wrap: balance; letter-spacing: .02em;
  }
  h2 { font-size: 1.45rem; font-weight: 400; margin: 0 0 .6rem; letter-spacing: .02em; }
  .intro {
    max-width: 36rem; margin: 0 auto 1.4rem; text-align: center;
    color: var(--dim); font-style: italic;
  }
  .scene { position: relative; border: 1px solid var(--edge); border-radius: 4px; overflow: hidden; }
  .scene img { display: block; width: 100%; height: auto; }
  .spot {
    position: absolute; transform: translate(-50%, -50%);
    width: 48px; height: 48px; border-radius: 50%; padding: 0;
    background: radial-gradient(circle, rgba(159,196,212,.28) 0%, rgba(159,196,212,.10) 45%, transparent 70%);
    border: 1px solid rgba(159,196,212,.5); cursor: pointer;
    animation: breathe 5s ease-in-out infinite;
  }
  .spot::after {
    content: attr(data-label); position: absolute; top: 105%; left: 50%;
    transform: translateX(-50%); white-space: nowrap;
    font-size: .62rem; letter-spacing: .22em; text-transform: uppercase;
    color: var(--glow); text-shadow: 0 1px 4px #000;
    font-family: Palatino, Georgia, serif;
  }
  .spot:focus-visible { outline: 2px solid var(--glow); outline-offset: 3px; }
  .spot.visited { opacity: .55; }
  @keyframes breathe {
    0%, 100% { box-shadow: 0 0 10px 2px rgba(159,196,212,.28); }
    50% { box-shadow: 0 0 20px 6px rgba(159,196,212,.10); }
  }
  /* The seam-light on the sealed lantern: faint WARM at the core inside the
     black chains — the only warm pixel on the page. */
  .seam {
    position: absolute; width: 26px; height: 10px; pointer-events: none;
    transform: translate(-50%, -50%);
    background: radial-gradient(ellipse 60% 55% at 50% 50%, rgba(224,169,77,.7), rgba(224,169,77,.22) 55%, transparent 78%);
    filter: blur(1.5px); animation: seep 7s ease-in-out infinite;
  }
  @keyframes seep {
    0%, 100% { opacity: .55; transform: translate(-50%, -50%) scale(1); }
    50% { opacity: .95; transform: translate(-50%, -50%) scale(1.25); }
  }
  @media (prefers-reduced-motion: reduce) {
    .spot, .seam { animation: none; }
  }
  .joint {
    position: absolute; transform: translate(-50%, -50%);
    width: 4px; height: 17%;
    background: linear-gradient(90deg,
      rgba(6,10,13,.95) 0 1px, rgba(128,156,168,.9) 1px 3px, rgba(6,10,13,.95) 3px 4px);
    -webkit-mask-image: linear-gradient(180deg, transparent, #000 9%, #000 91%, transparent);
    mask-image: linear-gradient(180deg, transparent, #000 9%, #000 91%, transparent);
  }
  .whisper { text-align: center; color: var(--dim); font-style: italic; font-size: .9rem; margin-top: .9rem; }

  /* Lightbox */
  .veil {
    position: fixed; inset: 0; background: rgba(3,6,8,.9); z-index: 10;
    display: none; overflow-y: auto; padding: 3vh 1rem 6vh;
  }
  .veil.open { display: block; }
  .panel {
    max-width: 36rem; margin: 0 auto; background: var(--card);
    border: 1px solid var(--edge); border-radius: 6px; padding: 1.4rem 1.5rem 1.8rem;
    box-shadow: 0 12px 60px rgba(0,0,0,.7);
  }
  .back {
    background: none; border: none; color: var(--dim); cursor: pointer;
    font: inherit; font-size: .82rem; letter-spacing: .14em; padding: 0;
    margin-bottom: 1.1rem; text-transform: uppercase;
  }
  .back:hover, .back:focus-visible { color: var(--glow); }
  .read { color: var(--parchment); margin: .9rem 0; }
  .read b { font-weight: 600; }
  .intro b { color: var(--parchment); font-weight: 400; }
  .label {
    font-size: .68rem; letter-spacing: .26em; text-transform: uppercase;
    color: var(--dim); margin: 1.4rem 0 .5rem;
  }
  /* The glyph wall — same alphabet the table earned at Maren's table. */
  /* The wall: one word, cut by many hands over many years. Depth varies
     because the caption says it does — the players should SEE the late,
     hurried ones without being told which is which. */
  .wall {
    text-align: center; margin: .6rem 0 1.1rem; color: var(--parchment);
    line-height: 1.75; max-height: 46vh; overflow: hidden;
    -webkit-mask-image: linear-gradient(#000 82%, transparent);
    mask-image: linear-gradient(#000 82%, transparent);
  }
  .wall span {
    display: inline-block; white-space: nowrap; letter-spacing: .16em;
    margin: 0 .34em .2em 0; font-size: clamp(.85rem, 2.1vw, 1.05rem);
    opacity: .82;
  }
  .wall span.deep { opacity: 1; text-shadow: 0 0 6px rgba(159,196,212,.35); }
  .wall span.faint { opacity: .45; }
  .passage {
    text-align: center; color: var(--dim); letter-spacing: .28em;
    line-height: 2.15; font-size: clamp(.95rem, 2.8vw, 1.2rem); margin: .6rem 0 .4rem;
  }
  .passage .known { color: var(--glow); }
  .caption { text-align: center; font-style: italic; color: var(--dim); margin: .9rem 0 0; }
  /* The covenant stone reveal */
  .names {
    text-align: center; letter-spacing: .22em; font-weight: 600;
    color: var(--parchment); font-size: clamp(1rem, 3vw, 1.25rem); margin: 1rem 0;
  }
  .names .halfgone { color: var(--dim); }
  .oath {
    text-align: center; font-style: italic; letter-spacing: .12em;
    color: var(--glow); margin: 1rem 0 .2rem;
  }
  /* Interactives */
  .go {
    background: none; border: 1px solid var(--glow); border-radius: 3px;
    color: var(--glow); font: inherit; letter-spacing: .06em;
    padding: .55rem 1rem; cursor: pointer;
  }
  .go:hover, .go:focus-visible { background: rgba(159,196,212,.12); }
  .go.solo { margin-top: .4rem; }
  .answer { min-height: 1.4rem; font-style: italic; color: var(--parchment); margin: .9rem 0 0; }
  .swim { animation: swim 1s ease-out; }
  @keyframes swim {
    0% { filter: blur(3px); opacity: 0; letter-spacing: .12em; }
    60% { filter: blur(1px); opacity: .7; letter-spacing: .04em; }
    100% { filter: blur(0); opacity: 1; letter-spacing: normal; }
  }
  @media (prefers-reduced-motion: reduce) { .swim { animation: none; } }
</style>

<main>
  <p class="eyebrow">Blackreef Deep &middot; below the singing</p>
  <h1>The Drowned Temple</h1>

<template id="tpl-covenant">
  <h2>The Covenant Stone</h2>
  <p class="read">A great tablet, furred with centuries of growth. Beneath the
  barnacles: names, cut deep in an old formal hand. A list of the sworn.</p>
  <button class="go solo" data-kind="reveal-once" data-id="covenant">Clear the growth</button>
  <div class="more" hidden>
    <p class="read">Most of the names are worn beyond reading. Three survive:</p>
    <p class="names">ASHMANTLE &middot; DUNMORE &middot; <span class="halfgone">&mdash;ORWALE</span></p>
    <p class="read">And beneath the names, one line of oath, still sharp:</p>
    <p class="oath">&ldquo;WHILE THE BRAID HOLDS, SO HOLD WE.&rdquo;</p>
  </div>
</template>

<template id="tpl-lantern">
  <h2>The Sealed Lantern</h2>
  <p class="read">The heart of the temple: a great wickless lantern, dark,
  wrapped round and round in chains of black that does not move like water.
  The links do not touch the lantern. They don&rsquo;t need to. Nothing about
  this is broken. Something about this is <b>HELD SHUT</b>.</p>
  <button class="go solo" data-kind="touch" data-id="lantern"
    data-text="Cold climbs your arm before your hand is halfway there &mdash; not the cold of deep water. The cold of a held door. And for exactly one heartbeat, you are certain that something, somewhere very close, has noticed your hand."
    data-again="Your hand remembers. It declines to go again.">Reach toward it</button>
  <p class="answer" aria-live="polite"></p>
</template>
<template id="tpl-kept">
  <h2>The Kept</h2>
  <p class="read">A man, held upright in the dark beside the lantern the way a
  coat is held by a hook. Weathered. Gray-bearded. Breathing. His eyes are
  closed and his boots do not quite touch the floor.</p>
  <p class="read">Willa knows him at one glance. Everyone else knows him from a
  hundred stories at The Mooring: <b>Captain Edrik Thorne.</b></p>
  <button class="go solo" data-kind="touch" data-id="kept"
    data-text="He does not wake. He does not stir. But when you come close &mdash; his lips are moving. Have been moving, maybe, for days. The same words, over and over, in a dry whisper: &ldquo;come home&hellip; child&hellip; come home&hellip;&rdquo;">Call to him</button>
  <p class="answer" aria-live="polite"></p>
</template>

<script>
  const veil = document.getElementById("veil");
  const body = document.getElementById("panel-body");
  let lastSpot = null;
  // Once-only interactions stay spent across panel reopens (page session).
  const spent = {};

  function say(el, text) {
    el.classList.remove("swim");
    void el.offsetWidth;
    el.textContent = text;
    el.classList.add("swim");
  }

  function wire() {
    body.querySelectorAll("[data-kind='reveal-once']").forEach((btn) => {
      const block = btn.parentElement.querySelector(".more");
      const show = (animate) => {
        block.hidden = false;
        if (animate) block.classList.add("swim");
        btn.remove();
      };
      if (spent[btn.dataset.id]) { show(false); return; }
      btn.addEventListener("click", () => {
        spent[btn.dataset.id] = true;
        show(true);
      });
    });
    body.querySelectorAll("[data-kind='touch']").forEach((btn) => {
      btn.addEventListener("click", () => {
        const out = btn.parentElement.querySelector(".answer");
        const again = btn.dataset.again;
        if (spent[btn.dataset.id] && again) {
          say(out, again);
          return;
        }
        spent[btn.dataset.id] = true;
        say(out, btn.dataset.text);
      });
    });
  }

  function open(id, spot) {
    const tpl = document.getElementById("tpl-" + id);
    if (!tpl) return;
    body.innerHTML = tpl.innerHTML;
    veil.classList.add("open");
    lastSpot = spot || null;
    if (spot) spot.classList.add("visited");
    wire();
    document.getElementById("back").focus();
  }
  function close() {
    veil.classList.remove("open");
    if (lastSpot) lastSpot.focus();
  }

  document.querySelectorAll(".spot").forEach((s) =>
    s.addEventListener("click", () => open(s.dataset.go, s))
  );

  document.querySelectorAll(".joint").forEach((j) =>
    j.addEventListener("click", () => open(j.dataset.panel, null))
  );

  // Deep links: #covenant / #glyphs / #lantern / #kept open that panel
  // straight away, so the DM's companion can send him to one hotspot.
  function openFromHash() {
    const id = (location.hash || "").replace("#", "");
    const spot = document.querySelector(`.spot[data-go="${id}"]`);
    if (spot) open(id, spot);
  }
  openFromHash();
  window.addEventListener("hashchange", openFromHash);

  document.getElementById("back").addEventListener("click", close);
  veil.addEventListener("click", (e) => { if (e.target === veil) close(); });
  document.addEventListener("keydown", (e) => { if (e.key === "Escape") close(); });
</script>
