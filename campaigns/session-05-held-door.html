<title>The Held Door</title>
<!--
  Session 5 explorable — The Held Door. Player surface.
-->
<style>
  :root {
    --soot: #06090c; --parchment: #cfd9de; --dim: #6f8089;
    --glow: #9fc4d4; --edge: #1a232a; --card: #0a1014;
  }
  html { background: var(--soot); }
  body {
    margin: 0; color: var(--parchment); background: var(--soot);
    font-family: Palatino, "Palatino Linotype", "Book Antiqua", Georgia, serif;
    line-height: 1.65;
  }
  main { max-width: 62rem; margin: 0 auto; padding: 1.2rem 1rem 4rem; }
  .eyebrow {
    font-size: .72rem; letter-spacing: .28em; color: var(--dim);
    text-transform: uppercase; margin: 1.4rem 0 .4rem; text-align: center;
  }
  h1 {
    font-size: clamp(1.6rem, 4.5vw, 2.6rem); font-weight: 400; margin: 0 0 .4rem;
    text-align: center; text-wrap: balance; letter-spacing: .02em;
  }
  h2 { font-size: 1.45rem; font-weight: 400; margin: 0 0 .6rem; letter-spacing: .02em; }
  .intro {
    max-width: 38rem; margin: 0 auto 1.4rem; text-align: center;
    color: var(--dim); font-style: italic;
  }
  .scene { position: relative; border: 1px solid var(--edge); border-radius: 4px; overflow: hidden; }
  .scene svg { display: block; width: 100%; height: auto; }
  .spot {
    position: absolute; transform: translate(-50%, -50%);
    width: 48px; height: 48px; border-radius: 50%; padding: 0;
    background: radial-gradient(circle, rgba(159,196,212,.28) 0%, rgba(159,196,212,.10) 45%, transparent 70%);
    border: 1px solid rgba(159,196,212,.5); cursor: pointer;
    animation: breathe 5s ease-in-out infinite;
  }
  .spot::after {
    content: attr(data-label); position: absolute; top: 105%; left: 50%;
    transform: translateX(-50%); white-space: nowrap;
    font-size: .62rem; letter-spacing: .22em; text-transform: uppercase;
    color: var(--glow); text-shadow: 0 1px 4px #000;
    font-family: Palatino, Georgia, serif;
  }
  .spot:focus-visible { outline: 2px solid var(--glow); outline-offset: 3px; }
  .spot.visited { opacity: .55; }
  @keyframes breathe {
    0%, 100% { box-shadow: 0 0 10px 2px rgba(159,196,212,.28); }
    50% { box-shadow: 0 0 20px 6px rgba(159,196,212,.10); }
  }
  /* The only motion on the page: the far light behind the standing water. */
  .farlight { animation: drift 19s ease-in-out infinite; }
  @keyframes drift {
    0%, 100% { transform: translate(-40px, 30px) scale(1); opacity: .5; }
    50%      { transform: translate(45px, -25px) scale(1.18); opacity: .85; }
  }
  @media (prefers-reduced-motion: reduce) {
    .spot, .farlight { animation: none; }
  }

  /* Lightbox */
  .veil {
    position: fixed; inset: 0; background: rgba(3,6,8,.9); z-index: 10;
    display: none; overflow-y: auto; padding: 3vh 1rem 6vh;
  }
  .veil.open { display: block; }
  .panel {
    max-width: 36rem; margin: 0 auto; background: var(--card);
    border: 1px solid var(--edge); border-radius: 6px; padding: 1.4rem 1.5rem 1.8rem;
    box-shadow: 0 12px 60px rgba(0,0,0,.7);
  }
  .back {
    background: none; border: none; color: var(--dim); cursor: pointer;
    font: inherit; font-size: .82rem; letter-spacing: .14em; padding: 0;
    margin-bottom: 1.1rem; text-transform: uppercase;
  }
  .back:hover, .back:focus-visible { color: var(--glow); }
  .read { color: var(--parchment); margin: .9rem 0; }
  .read b { font-weight: 600; }
  .word {
    text-align: center; letter-spacing: .3em; color: var(--parchment);
    font-size: clamp(1.9rem, 6vw, 2.8rem); margin: 1rem 0 .6rem;
  }
  .go {
    background: none; border: 1px solid var(--glow); border-radius: 3px;
    color: var(--glow); font: inherit; letter-spacing: .06em;
    padding: .55rem 1rem; cursor: pointer;
  }
  .go:hover, .go:focus-visible { background: rgba(159,196,212,.12); }
  .go.solo { margin-top: .4rem; }
  .answer { min-height: 1.4rem; font-style: italic; color: var(--parchment); margin: .9rem 0 0; }
  .swim { animation: swim 1s ease-out; }
  @keyframes swim {
    0% { filter: blur(3px); opacity: 0; letter-spacing: .12em; }
    60% { filter: blur(1px); opacity: .7; letter-spacing: .04em; }
    100% { filter: blur(0); opacity: 1; letter-spacing: normal; }
  }
  @media (prefers-reduced-motion: reduce) { .swim { animation: none; } }
</style>

<main>
  <p class="eyebrow">Blackreef Deep &middot; the last door</p>
  <h1>The Held Door</h1>

  keep people out. It was built so that going in <b>cost something</b>.</p>

<div class="veil" id="veil" role="dialog" aria-modal="true">
  <div class="panel">
    <button class="back" id="back">&#8617; return to the door</button>
    <div id="panel-body"></div>
  </div>
</div>

<template id="tpl-door">
  <h2>The Door</h2>
  <p class="read">A door of standing water, floor to arch, thin as a pane and
  steady as stone. Light moves behind it &mdash; slow, silver, far away. Sound
  does not come through. The arch above it is bare dressed stone &mdash; the
  only uncarved surface in the temple.</p>
  <button class="go solo" data-kind="touch" data-id="door"
    data-text="Cold, and firm, and unhurried. It is not refusing you. It is waiting for something, and you are not yet it."
    data-again="The water has not changed its mind.">Touch the water</button>
  <p class="answer" aria-live="polite"></p>
</template>

<template id="tpl-stations">
  <h2>The Four Stations</h2>
  <p class="read">Four waist-high stone posts stand before the door in a shallow
  arc, each crowned with a carved hand, palm up. The carving is plain: the hands
  are for holding.</p>
  <button class="go solo" data-kind="touch" data-id="stations"
    data-text="Three of the crowns bear house-marks, worn soft but readable &mdash; the same marks that head the surviving names on the covenant stone. Three marks. Four stations.">Look closer</button>
  <p class="answer" aria-live="polite"></p>
</template>

<template id="tpl-station-03">
  <h2>The Third Station</h2>
  <p class="read">The other three marks are worn. This one is cut.</p>
  <p class="read">Somebody stood here with a chisel and took a mark off the
  stone. The gouges are old. But they are gouges, not weather.</p>
</template>

<script>
  const veil = document.getElementById("veil");
  const body = document.getElementById("panel-body");
  let lastSpot = null;
  const spent = {};

  function say(el, text) {
    el.classList.remove("swim");
    void el.offsetWidth;
    el.textContent = text;
    el.classList.add("swim");
  }

  function wire() {
    body.querySelectorAll("[data-kind='touch']").forEach((btn) => {
      btn.addEventListener("click", () => {
        const out = btn.parentElement.querySelector(".answer");
        const again = btn.dataset.again;
        if (spent[btn.dataset.id] && again) { say(out, again); return; }
        spent[btn.dataset.id] = true;
        say(out, btn.dataset.text);
      });
    });
  }

  function open(id, spot) {
    const tpl = document.getElementById("tpl-" + id);
    if (!tpl) return;
    body.innerHTML = tpl.innerHTML;
    veil.classList.add("open");
    lastSpot = spot || null;
    if (spot) spot.classList.add("visited");
    wire();
    document.getElementById("back").focus();
  }
  function close() {
    veil.classList.remove("open");
    if (lastSpot) lastSpot.focus();
  }

  document.querySelectorAll(".spot").forEach((s) =>
    s.addEventListener("click", () => open(s.dataset.go, s))
  );

  // Crown details.
  document.querySelectorAll(".crown-detail").forEach((d) =>
    d.addEventListener("click", () => {
      if (d.dataset.panel) open(d.dataset.panel, null);
    })
  );

  function openFromHash() {
    const id = (location.hash || "").replace("#", "");
    const spot = document.querySelector(`.spot[data-go="${id}"]`);
    if (spot) open(id, spot);
  }
  openFromHash();
  window.addEventListener("hashchange", openFromHash);

  document.getElementById("back").addEventListener("click", close);
  veil.addEventListener("click", (e) => { if (e.target === veil) close(); });
  document.addEventListener("keydown", (e) => { if (e.key === "Escape") close(); });
</script>
